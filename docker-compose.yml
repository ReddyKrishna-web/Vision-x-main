version: '3.9'

services:
  vision-x:
    build:
      context: .
      dockerfile: Dockerfile
    image: vision-x-main:latest
    container_name: vision-x
    ports:
      - "30001:30001"
    environment:
      NODE_ENV: production
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      TEAM_JWT_SECRET: ${TEAM_JWT_SECRET:-}
      NEXT_PUBLIC_HACKATHON_NAME: ${NEXT_PUBLIC_HACKATHON_NAME:-VISION X 2026 HACKATHON}
      EXCEL_EXPORT_PATH: ./data/vision-x-registrations.xlsx
      EXCEL_SYNC_ENABLED: "true"
      EXCEL_SYNC_MAX_RETRIES: "5"
      EXCEL_STORAGE_PROVIDER: local
      FRAUD_AUTO_APPROVE_MAX_RISK: "29"
      FRAUD_REVIEW_MIN_RISK: "60"
      FRAUD_BLOCK_MIN_RISK: "80"
      # Optional: OCR and SMTP
      OCRSPACE_API_KEY: ${OCRSPACE_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      # Persistent volume for SQLite DB, uploads, and Excel workbook
      - vision-x-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:30001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  vision-x-data:
    driver: local
