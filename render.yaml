# Render Blueprint: `render blueprint launch` or "New > Blueprint" with this repo.
# Fixes the classic "Port scan timeout ... failed to detect open port 10000"
# caused by hardcoding `-p 30001`: `npm start` now respects Render's `PORT`.
services:
  - type: web
    name: vision-x
    runtime: node
    plan: starter
    buildCommand: npm ci; npm run build
    startCommand: npm run start
    healthCheckPath: /api/settings
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: TEAM_JWT_SECRET
        sync: false
      - key: NEXT_PUBLIC_HACKATHON_NAME
        value: VISION X 2026 HACKATHON
      - key: EXCEL_EXPORT_PATH
        value: ./data/vision-x-registrations.xlsx
      - key: EXCEL_SYNC_ENABLED
        value: true
      - key: EXCEL_SYNC_MAX_RETRIES
        value: 5
      - key: EXCEL_STORAGE_PROVIDER
        value: local
disk:
  name: vision-x-data
  mountPath: /opt/render/project/src/data
  sizeGB: 5
